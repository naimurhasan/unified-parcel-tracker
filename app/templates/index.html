<!DOCTYPE html>
<html>
<head>
    <title>Sunbeam Mail Track</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">🌅 Sunbeam Mail Track</h1>
        
        <div class="row">
            <div class="col-md-6">
                <form id="trackingForm">
                    <div class="mb-3">
                        <label class="form-label">Vendor</label>
                        <select class="form-select" name="vendor" required>
                            <option value="">Select Vendor</option>
                            <option value="BPO">Bangladesh Post Office</option>
                            <option value="Sundarban">Sundarban</option>
                            <option value="Steadfast">Steadfast</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tracking Number</label>
                        <input type="text" class="form-control" name="tracking_number" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Track Package</button>
                </form>
            </div>
            
            <div class="col-md-6">
                <div id="result" class="mt-4"></div>
            </div>
        </div>
        
        <div class="mt-5">
            <h3>Recent Requests</h3>
            <div id="requests" class="mt-3"></div>
        </div>
    </div>

    <script>
        document.getElementById('trackingForm').onsubmit = async function(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            
            const response = await fetch('/track', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            
            const result = await response.json();
            document.getElementById('result').innerHTML = 
                `<div class="alert alert-success">Request submitted! ID: ${result.id}, Status: ${result.status}</div>`;
            
            loadRequests();
        };

        async function loadRequests() {
            const response = await fetch('/requests');
            const requests = await response.json();
            
            document.getElementById('requests').innerHTML = requests.map(req => 
                `<div class="card mb-2">
                    <div class="card-body">
                        <strong>${req.vendor}</strong> - ${req.tracking_number} 
                        <span class="badge bg-${req.status === 'completed' ? 'success' : 'warning'}">${req.status}</span>
                        ${req.status === 'completed' ? `<button class="btn btn-sm btn-info ms-2" onclick="viewResult(${req.id})">View Result</button>` : ''}
                    </div>
                </div>`
            ).join('');
        }

        async function viewResult(requestId) {
            const response = await fetch(`/results/${requestId}`);
            const result = await response.json();
            
            const events = result.events.map(event => 
                `<li><strong>${event.datetime}</strong>: ${event.comment} ${event.location ? `(${event.location})` : ''}</li>`
            ).join('');
            
            document.getElementById('result').innerHTML = 
                `<div class="card">
                    <div class="card-header">Tracking Result</div>
                    <div class="card-body">
                        <p><strong>From:</strong> ${result.sender}</p>
                        <p><strong>To:</strong> ${result.receiver}</p>
                        <p><strong>Status:</strong> ${result.parcel_current_status}</p>
                        <h6>Events:</h6>
                        <ul>${events}</ul>
                    </div>
                </div>`;
        }

        loadRequests();
    </script>
</body>
</html>
